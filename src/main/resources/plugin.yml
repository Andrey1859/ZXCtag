name: ZXCtag
version: ${version}
main: ru.andrey1859.zxctag.ZXCtagPlugin
api-version: "1.21"
author: Andrey1859
description: Префикс класса, жёлтый уровень и HP над игроком
commands:
  zxc:
    description: Выдать префикс, уровень и HP
    usage: /zxc <ник> <класс> <статус> <лвл> <ус> <хп>
    permission: zxctag.zxc
permissions:
  zxctag.zxc:
    description: Использование /zxc
    default: op
